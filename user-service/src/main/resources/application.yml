spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:user_db}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/auth/realms/encg-assistant
          jwk-set-uri: http://keycloak:8080/auth/realms/encg-assistant/protocol/openid-connect/certs

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction: TRACE

server:
  port: 8081

  servlet:
    context-path: /api

  forward-headers-strategy: framework

keycloak:
  server-url: http://keycloak:8080/auth

  admin:
    realm: master
    username: ${KEYCLOAK_ADMIN}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-id: admin-cli

  application:
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}