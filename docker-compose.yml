services:
  postgres_chat:
    image: postgres:17
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_CHAT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CHAT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CHAT_DB}

    ports:
      - '5432:5432'

    volumes:
      - postgres_chat_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  postgres_keycloak:
    image: postgres:17
    container_name: keycloak-postgres
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB}

    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  postgres_user:
    image: postgres:17
    container_name: user-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER_DB}

    volumes:
      - postgres_user_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: keycloak
    command: start-dev

    depends_on:
      postgres_keycloak:
        condition: service_healthy

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${KEYCLOAK_HOST}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # IMPORTANT
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: 'xforwarded'
      KC_HOSTNAME: 'http://localhost/auth'
      KC_HOSTNAME_STRICT: 'true'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_RELATIVE_PATH: '/auth'

    ports:
      - '8082:8080'

    networks:
      - chatbot-network

  chat-service:
    build: ./chat-service
    container_name: chat-service
    depends_on:
      postgres_chat:
        condition: service_healthy
      keycloak:
        condition: service_started
      ai-service:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${CHAT_DB_HOST}:${CHAT_DB_PORT}/${CHAT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CHAT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD}
      SERVICES_USER_URL: http://user-service:8081/api
      SERVICES_AI_URL: http://ai-service:8000/ai

    ports:
      - '8080:8080'

    networks:
      - chatbot-network

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT}/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    ports:
      - '8081:8081'

    depends_on:
      postgres_user:
        condition: service_healthy
      keycloak:
        condition: service_started

    networks:
      - chatbot-network

  ai-service:
    build: ./ai-service
    container_name: ai-service
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      CHAT_SERVICE_URL: http://chat-service:8080

    ports:
      - '8000:8000'

    networks:
      - chatbot-network

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chatbot-network

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - chat-service
      - user-service
      - ai-service

    networks:
      - chatbot-network

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - frontend
      - chat-service
      - ai-service
      - user-service

    ports:
      - '80:80'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - chatbot-network

volumes:
  postgres_chat_data:
  postgres_user_data:
  postgres_keycloak_data:
  ollama_data:

networks:
  chatbot-network:
