services:
  # DATABASES
  postgres_chat:
    image: postgres:17
    container_name: chatbot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_CHAT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CHAT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CHAT_DB}

    volumes:
      - postgres_chat_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_CHAT_USER} -d ${POSTGRES_CHAT_DB}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  postgres_keycloak:
    image: postgres:17
    container_name: keycloak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB}

    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  postgres_user:
    image: postgres:17
    container_name: user-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER_DB}

    volumes:
      - postgres_user_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USER_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  postgres-rag:
    image: pgvector/pgvector:pg17
    container_name: postgres_rag
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_RAG_DB}
      POSTGRES_USER: ${POSTGRES_RAG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_RAG_PASSWORD}

    volumes:
      - postgres_rag_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_RAG_USER} -d ${POSTGRES_RAG_DB}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  # KEYCLOAK
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: keycloak
    restart: unless-stopped

    command: start --import-realm

    depends_on:
      postgres_keycloak:
        condition: service_healthy

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${KEYCLOAK_HOST}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}

      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: 'xforwarded'

      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: 'true'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'

      KC_HTTP_RELATIVE_PATH: /auth

    volumes:
      - ./keycloak/encg-assistant-realm.json:/opt/keycloak/data/import/encg-assistant-realm.json:ro

    networks:
      - chatbot-network

  # CHAT SERVICE
  chat-service:
    build:
      context: ./chat-service

    container_name: chat-service
    restart: unless-stopped

    depends_on:
      postgres_chat:
        condition: service_healthy
      keycloak:
        condition: service_started
      ai-service:
        condition: service_started
      rag-service:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${CHAT_DB_HOST}:${CHAT_DB_PORT}/${CHAT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CHAT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD}

      SERVICES_USER_URL: http://user-service:8081/api
      SERVICES_AI_URL: http://ai-service:8000/ai
      SERVICES_RAG_URL: http://rag-service:8000

    networks:
      - chatbot-network

  # USER SERVICE
  user-service:
    build:
      context: ./user-service

    container_name: user-service
    restart: unless-stopped

    depends_on:
      postgres_user:
        condition: service_healthy
      keycloak:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT}/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    networks:
      - chatbot-network

  # AI SERVICE
  ai-service:
    build:
      context: ./ai-service

    container_name: ai-service
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_started

    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      CHAT_SERVICE_URL: http://chat-service:8080

    networks:
      - chatbot-network

  # RAG SERVICE
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile

    container_name: rag-service
    restart: unless-stopped

    environment:
      POSTGRES_RAG_HOST: postgres-rag
      POSTGRES_RAG_PORT: 5432
      POSTGRES_RAG_DB: ${POSTGRES_RAG_DB}
      POSTGRES_RAG_USER: ${POSTGRES_RAG_USER}
      POSTGRES_RAG_PASSWORD: ${POSTGRES_RAG_PASSWORD}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base

    depends_on:
      postgres-rag:
        condition: service_healthy

    volumes:
      - ./rag-service/documents:/app/documents
      - rag-huggingface-cache:/root/.cache/huggingface

    networks:
      - chatbot-network

    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000']

  # OLLAMA
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - chatbot-network

  # FRONTEND
  frontend:
    build:
      context: ./frontend

    container_name: frontend
    restart: unless-stopped

    depends_on:
      - chat-service
      - user-service

    networks:
      - chatbot-network

  # NGINX
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    depends_on:
      - frontend
      - chat-service
      - user-service
      - keycloak

    ports:
      - '80:80'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - chatbot-network

# VOLUMES
volumes:
  postgres_chat_data:
  postgres_user_data:
  postgres_keycloak_data:
  postgres_rag_data:
  ollama_data:
  rag-huggingface-cache:

# NETWORK
networks:
  chatbot-network:
